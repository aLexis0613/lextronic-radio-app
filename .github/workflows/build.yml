name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK fordítása
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk LextronicRadio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LextronicRadio
          path: LextronicRadio.apk
      # mindig a legfrissebb APK a „latest” kiadásban -> telefonról egy kattintással letölthető
      - name: Kiadás frissítése
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LextronicRadio.apk \
            --title "Legfrissebb build ($(date +'%Y-%m-%d %H:%M'))" \
            --notes "Commit: ${GITHUB_SHA::7} — $MSG" \
            --prerelease
